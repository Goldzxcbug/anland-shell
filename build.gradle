// Single-module pure-Java APK: the Anland shell (launcher) for Droidspaces
// containers. No dependencies, no AndroidX, no native code — all privileged
// work goes through `su -c` + the droidspaces CLI; window hosting lives in
// the anland daemon and the com.anlandnext host APK (auto-attach).
//
// Signing uses debug.keystore (gitignored; the Makefile bootstraps it with
// keytool when missing) so release APKs stay installable over previous dev
// builds — same scheme as the anland repo.
plugins {
    id 'com.android.application' version '9.4.0'
}

android {
    namespace 'com.anland.shell'
    compileSdk 36

    defaultConfig {
        applicationId 'com.anland.shell'
        minSdk 28
        targetSdk 28
        versionCode 1
        versionName '0.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            storeFile file('debug.keystore')
            storePassword 'anland'
            keyAlias 'anland'
            keyPassword 'anland'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        // Sideloaded root tool — never distributed via Google Play; targetSdk 28
        // is deliberate (legacy shortcut/pinning semantics).
        disable 'ExpiredTargetSdkVersion'
    }
}
